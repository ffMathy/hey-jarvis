<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070a" />
    <title>Jarvis preview</title>
    <link rel="icon" type="image/png" href="./icon-512.png" />
    <style>
      :root {
        color-scheme: dark;
        --background: #05070a;
        --panel: #0d1117;
        --text: #e8ecf0;
        --muted: #8a949e;
        --accent: #dc5c20;
        /* What stands in for a room seen through passthrough: a mid grey, like the emulator's. */
        --passthrough: #8c8c8c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: var(--background);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-weight: 300;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-size: 1.4rem;
      }
      #stage {
        position: relative;
        width: min(100%, 72vh, 900px);
        aspect-ratio: 1;
        background: #000;
        border-radius: 0.5rem;
        overflow: hidden;
        touch-action: none;
      }
      #stage[data-background='grey'] {
        background: var(--passthrough);
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem 1.5rem;
        max-width: 60rem;
      }
      fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-items: center;
        margin: 0;
        padding: 0.4rem 0.6rem;
        border: 1px solid #1f2630;
        border-radius: 0.5rem;
        background: var(--panel);
      }
      legend {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 0 0.3rem;
      }
      button {
        padding: 0.45rem 0.9rem;
        border: 1px solid #2a323d;
        border-radius: 999px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--background);
      }
      button:disabled {
        color: var(--muted);
        cursor: default;
      }
      input[type='range'] {
        accent-color: var(--accent);
      }
      #readout {
        min-height: 1.4em;
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Jarvis</h1>
    <div id="stage" data-background="black">
      <canvas id="view"></canvas>
    </div>
    <p id="readout" role="status" aria-live="off">Getting Jarvis ready…</p>
    <div id="controls">
      <fieldset id="phases">
        <legend>What he is doing</legend>
        <button type="button" data-phase="arriving">Arriving</button>
        <button type="button" data-phase="greeting">Greeting</button>
        <button type="button" data-phase="speaking">Speaking</button>
        <button type="button" data-phase="listening">Listening</button>
        <button type="button" data-phase="thinking">Thinking</button>
        <button type="button" data-phase="idle">Idle</button>
        <button type="button" data-phase="leaving">Leaving</button>
      </fieldset>
      <fieldset>
        <legend>Drawn</legend>
        <button type="button" data-mode="volumetric">In 3D</button>
        <button type="button" data-mode="flat">Flat, as the phone</button>
      </fieldset>
      <fieldset>
        <legend>Behind him</legend>
        <button type="button" data-background="black">Black</button>
        <button type="button" data-background="grey">Passthrough grey</button>
      </fieldset>
      <fieldset>
        <legend>Seen from</legend>
        <button type="button" data-view="front">The front</button>
        <button type="button" data-view="side">45° to the side</button>
        <button type="button" data-view="orbit">Walking round him</button>
      </fieldset>
      <fieldset>
        <legend>How much of the room his light hides</legend>
        <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.85" aria-label="Alpha factor" />
        <output id="alpha-value" for="alpha">0.85</output>
      </fieldset>
      <fieldset>
        <legend>On a headset</legend>
        <button id="enter-room" type="button" disabled>Enter your room</button>
      </fieldset>
    </div>
    <p id="readout-help">
      Drag to look round him, scroll to come closer. In the room, pull the trigger or pinch to go to the next phase.
      <a href="./">Back to the app</a>
    </p>
    <script type="module" src="./src/preview/main.ts"></script>
  </body>
</html>
