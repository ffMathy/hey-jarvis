; WORKSPACE_ROOT must be set in the environment before launching supervisord.
; In Docker it is set via the ENV instruction; locally serve.sh exports it.
;
; Both programs start through run-with-env.sh, the same wrapper the rest of the
; repository uses: it takes anything already in the environment, and resolves
; whatever is missing from the op:// references in mcp/op.env using the 1Password
; CLI. Set OP_SERVICE_ACCOUNT_TOKEN on the container and no secret has to be
; written to an env file or baked into the image.
;
; ## Why both programs retry without a practical limit
;
; A process that dies within `startsecs` counts as a *failed start*, and after
; `startretries` of those in a row supervisord marks it FATAL and never tries it
; again. At the old value of three, one bad morning — 1Password not answering
; yet, the Pi still coming up after a power cut, a bundle that ran out of memory
; — retired a program permanently.
;
; Nothing else picks that up. `restart: unless-stopped` in docker-compose.yml
; acts on the *container* exiting, and the container does not exit: supervisord
; is still alive, still supervising whatever did start. A failing HEALTHCHECK
; does not restart anything either — Docker reports health, it does not act on
; it. So a FATAL `mastra dev` leaves port 4111 dead until a human notices, with
; the Cloudflare hostname in front of it answering 502 the whole time.
;
; Giving up on the container as a whole instead would be worse: 4112 is what
; ElevenLabs calls, and Studio failing to build is no reason for the house to
; lose its assistant. So each program retries on its own, indefinitely, and the
; other one keeps serving meanwhile.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord-hey-jarvis.pid
loglevel=info

; Without these three sections `supervisorctl` has nothing to talk to, and the one
; moment anybody reaches for it is the one where a single program has died and the
; container is otherwise fine — `supervisorctl status` to see which, `supervisorctl
; restart mastra-dev` to bring it back without taking the MCP endpoint down with it.
; supervisorctl finds this file at /etc/supervisord.conf on its own search path, so it
; needs no arguments inside the image.
;
; The socket is in /tmp because that is writable, and 0700 keeps it to the user the
; container runs as.
[unix_http_server]
file=/tmp/supervisor-hey-jarvis.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor-hey-jarvis.sock

[program:mastra-dev]
command=bash %(ENV_WORKSPACE_ROOT)s/.scripts/run-with-env.sh %(ENV_WORKSPACE_ROOT)s/mcp/op.env bun run %(ENV_WORKSPACE_ROOT)s/node_modules/.bin/mastra dev --dir %(ENV_WORKSPACE_ROOT)s/mcp/mastra
directory=%(ENV_WORKSPACE_ROOT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
; `mastra dev` bundles the server before it listens, which on a Pi is tens of
; seconds. Anything shorter counts a crash *during* the bundle as a successful
; start followed by an exit, so the retry counter never reflects what happened.
startsecs=30
startretries=1000000
priority=1

[program:mcp-server]
command=bash %(ENV_WORKSPACE_ROOT)s/.scripts/run-with-env.sh %(ENV_WORKSPACE_ROOT)s/mcp/op.env bun %(ENV_WORKSPACE_ROOT)s/mcp/mastra/mcp-server.ts
directory=%(ENV_WORKSPACE_ROOT)s
environment=PORT="4112",HOST="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
; No bundling step here — it binds as soon as the secrets resolve, so ten
; seconds is already generous.
startsecs=10
startretries=1000000
priority=2
