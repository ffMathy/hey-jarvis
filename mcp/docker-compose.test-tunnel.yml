# Persistent MCP server for the ElevenLabs test agent.
#
# The agent-prompt tests talk to a hosted agent, and ElevenLabs decides whether
# that agent has tools by reaching the MCP server itself. A tunnel that only
# exists while CI runs is therefore not enough: ElevenLabs refreshes the
# integration on its own schedule, and any refresh landing between runs finds
# nothing and caches is_connected=false for the conversations that follow.
#
# So the connector's lifetime belongs to this deployment rather than to a job.
# Run it somewhere that stays up, pointed at its own MCP instance — keeping it
# separate from the production one means a routed test prompt can never reach
# the tools that run the house.
#
#   OP_SERVICE_ACCOUNT_TOKEN=… HEY_JARVIS_MCP_IMAGE_TAG=… \
#     docker compose -f mcp/docker-compose.test-tunnel.yml up -d
#
# In the Cloudflare dashboard, the tunnel this token belongs to must route its
# public hostname to http://mcp:4112 — the same hostname the test agent's MCP
# integration points at.

services:
  mcp:
    image: ghcr.io/ffmathy/mcp:${HEY_JARVIS_MCP_IMAGE_TAG:?set the released MCP image tag, e.g. 1.9.0}
    restart: unless-stopped
    environment:
      # The only secret this deployment holds. Everything else is resolved at
      # startup from the op:// references in mcp/op.env, by the 1Password CLI
      # inside the image — no plaintext secrets on the host, none in the image.
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN:?set a 1Password service account token}
    expose:
      - '4112'

  tunnel:
    # Pinned by digest: the connector is what publishes this server to the
    # internet, so it should not change underneath the deployment.
    image: docker.io/cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${HEY_JARVIS_CLOUDFLARED_TUNNEL_TOKEN:?set the test tunnel token}
    depends_on:
      mcp:
        condition: service_healthy
