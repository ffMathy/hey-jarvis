version: 2

# Supply chain defense: every ecosystem below delays adoption of new versions
# so security vendors have time to detect and remove malicious packages. This
# mirrors the `minimumReleaseAge` setting in bunfig.toml. Security updates (CVE
# patches) bypass the cooldown automatically.
updates:
  # npm dependencies for root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    open-pull-requests-limit: 10
    # Keep exact pins exact instead of widening them into ranges.
    versioning-strategy: "increase"
    groups:
      mastra:
        patterns:
          - "@mastra/*"
          - "mastra"
      turbo:
        patterns:
          - "turbo"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  # npm dependencies for mcp subproject
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      time: "09:00"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  # npm dependencies for elevenlabs subproject
  - package-ecosystem: "npm"
    directory: "/elevenlabs"
    schedule:
      interval: "weekly"
      time: "09:00"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/elevenlabs"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directory: "/mcp"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7

  # GitHub Actions dependencies — pinned to commit SHAs, which Dependabot
  # updates in place while keeping the human-readable version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
    cooldown:
      default-days: 7

  # The devcontainer's base image and features.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
    cooldown:
      default-days: 7
