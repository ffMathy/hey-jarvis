# This workflow is managed by gh actions-lock.

name: Mobile APK

# Builds the Android app and uploads the APK as a workflow artifact, so the app
# can be side-loaded onto a phone without a local Android toolchain or an EAS
# account. Open the run, and the APK is under "Artifacts" — it downloads as the
# `.apk` itself, not a zip.
#
# Only changes that can alter the app start it: the mobile workspace, the
# dependency lock, and the build configuration around them. Everything else in
# the monorepo has no path into the APK, and a native build is too slow to run
# on every push for nothing.
on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      # The sphere itself lives in its own package now, shared with the watch.
      - 'hologram/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/mobile-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      # The sphere itself lives in its own package now, shared with the watch.
      - 'hologram/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

# Least privilege by default: the job below opts into exactly what it needs.
permissions: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Checkout is the only thing that needs the token. Uploading an artifact goes
    # through the Actions runtime's own credential, not GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # The runner's Android SDK is what this job builds with.
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # The build runs untrusted pull request code; never leave a usable
          # GitHub token behind in .git/config for it to pick up.
          persist-credentials: false

      # Straight on the runner rather than in the dev container used by CI: the
      # runner image already carries the Android SDK with its licences accepted,
      # which the container does not.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # `packageManager` in package.json, so this cannot drift from the pin.
          bun-version-file: package.json

      # React Native's Gradle plugin bundles the JavaScript by running `node`
      # itself, and 0.86 refuses anything older than 20.19.4 — so the version is
      # pinned rather than left to whatever the runner image ships.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          # There is no npm/yarn/pnpm cache to restore; dependencies come from bun.
          package-manager-cache: false

      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # Dependency jars and the Gradle distribution only. Gradle's transform and
      # build caches are several gigabytes, slower to save and restore than to
      # rebuild, and would crowd the Turborepo cache out of the repository quota.
      - name: Restore Gradle dependency cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'mobile/app.config.ts', 'mobile/modules/*/android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build APK
        run: bunx turbo build:apk --filter=mobile

      # The artifact is named after the file, so the file carries the commit it
      # was built from; two downloaded builds are then told apart by name. On a
      # pull request GITHUB_SHA is GitHub's temporary merge commit, which nobody
      # would recognise, so the branch head is used there instead.
      - name: Name APK after the commit
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mv dist/mobile-apk/jarvis.apk "dist/mobile-apk/jarvis-${COMMIT_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/mobile-apk/jarvis-*.apk
          # Uploaded as the file itself rather than zipped, so the download is an
          # APK a phone can open directly.
          archive: false
          if-no-files-found: error
          retention-days: 30
