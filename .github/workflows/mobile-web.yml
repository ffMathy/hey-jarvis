# This workflow is managed by gh actions-lock.

name: Mobile Web

# Publishes both of Jarvis's web builds to GitHub Pages, so he can be watched in a
# browser, or stood in a room with on a headset, without installing anything:
#
#   /hey-jarvis/                 the phone app's web build (mobile/)
#   /hey-jarvis/vr/              the Meta Quest app that puts him in your room (vr/)
#   /hey-jarvis/pr/<n>/          pull request <n>'s phone app
#   /hey-jarvis/pr/<n>/vr/       pull request <n>'s headset app
#
# What is at the root is the real phone app: the same conversation screen, the
# same hologram, drawn by CanvasKit instead of native Skia. Taking over the assist
# gesture is Android's alone and the app says so when it is on web, so the page
# is for looking at Jarvis and talking to him, not for replacing your assistant.
#
# The root is the release: `release.yml` calls this once Release Please has tagged
# one, handing it the tagged commit, so the root always shows what was released.
# `web-preview.yml` calls it for every push to a pull request with `subpath:
# pr/<n>`, so each pull request can be opened on a phone or a headset before it is
# merged. It can also be started by hand from the Actions tab, which republishes
# the root from whichever branch it is started on.
#
# Pages serves the `gh-pages` branch (Settings → Pages → Deploy from a branch),
# because a site published as one artifact cannot hold a folder per pull request
# beside the release: every deployment would replace the others. The release and
# each preview write only their own part of the branch — see
# `.scripts/publish-pages.sh`. Each part is built whole, phone and headset
# together, so the two always come from the same commit.
on:
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build. Release passes the tagged one, which is not the commit its run started from.'
        type: string
        required: false
        default: ''
      subpath:
        description: 'Where on the site to publish: empty for the root, pr/<n> for a pull request preview.'
        type: string
        required: false
        default: ''
    outputs:
      url:
        description: 'Where the phone app was published; the headset app is in vr/ below it.'
        value: ${{ jobs.publish.outputs.url }}
  workflow_dispatch:

# Least privilege by default: the job below opts into exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One run per part of the site at a time, and a run already under way is left to
    # finish rather than cancelled. Runs for different parts may overlap; the publish
    # script settles who pushes first.
    concurrency:
      group: web-pages-${{ inputs.subpath || 'root' }}
      cancel-in-progress: false

    permissions:
      # Checking the code out, and pushing the built site to the `gh-pages` branch.
      contents: write
      # Asking Pages which address the site is served from.
      pages: read

    outputs:
      url: ${{ steps.where.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # Empty for a manual run, which takes the commit that started it, and for a
          # pull request, which takes its merge with main. Release passes the tagged
          # commit — see `deploy` in `release.yml` for why.
          ref: ${{ inputs.ref }}
          # Never leave a usable token in .git/config: the token reaches only the
          # steps below that are handed it.
          persist-credentials: false

      # A project site lives under /<repo>/, and a preview under /<repo>/pr/<n>/, so
      # the phone's build is told its own prefix — see `experiments.baseUrl` in
      # app.config.ts. Without it every asset the page asks for is looked for at the
      # domain root and comes back 404. Asked of Pages rather than assumed, so a
      # custom domain, which serves from `/`, needs no change here.
      - name: Find where the site is served
        id: where
        env:
          GH_TOKEN: ${{ github.token }}
          SUBPATH: ${{ inputs.subpath }}
        run: |
          site_url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          site_url=${site_url%/}
          base_path=$(sed -E 's#^https?://[^/]+##' <<<"$site_url")
          if [ -n "$SUBPATH" ]; then
            site_url="$site_url/$SUBPATH"
            base_path="$base_path/$SUBPATH"
          fi
          echo "url=$site_url/" >> "$GITHUB_OUTPUT"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # `packageManager` in package.json, so this cannot drift from the pin.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `setup-skia-web` copies canvaskit.wasm into mobile/public/, which the export
      # publishes as-is. The file is gitignored — it comes from the Skia package
      # rather than the repository — so without this the site goes up without it,
      # the browser's fetch for it returns the 404 page, instantiating that throws,
      # and the hologram's error boundary holds its space empty. Which is exactly
      # how the first published page looked: everything but Jarvis.
      - name: Fetch CanvasKit
        run: bunx turbo initialize --filter=mobile

      # First, so a headset app that does not build fails the run before the phone
      # app's slower export. `turbo build` also runs its initialize (the wasm into
      # public/vendor/), lint and typecheck, and writes it to dist/vr. Its
      # asset URLs are relative, so it needs no base path of its own, and the same
      # build works at the root and in a preview's folder.
      - name: Build the headset app
        run: bunx turbo build --filter=vr

      - name: Export the web build
        env:
          PAGES_BASE_URL: ${{ steps.where.outputs.base_path }}
        run: bunx expo export --platform web --output-dir dist --clear
        working-directory: mobile

      # One folder for the one part of the site: the phone app at its root, the
      # headset app in vr/. Nothing in the phone's export is called vr or pr, so
      # they never clash with each other or with the previews beside the release.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r mobile/dist/. _site/
          cp -r dist/vr _site/vr

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          SUBPATH: ${{ inputs.subpath }}
        run: .scripts/publish-pages.sh "$SUBPATH" _site

      - name: Summarise
        env:
          URL: ${{ steps.where.outputs.url }}
        run: |
          {
            echo "### Published"
            echo "- Phone app: $URL"
            echo "- Headset app: ${URL}vr/"
          } >> "$GITHUB_STEP_SUMMARY"
