# This workflow is managed by gh actions-lock.

name: Mobile Web

# Publishes both of Jarvis's web builds to GitHub Pages, so he can be watched in a
# browser, or stood in a room with on a headset, without installing anything:
#
#   /hey-jarvis/           the phone app's web build (mobile/)
#   /hey-jarvis/horizon/   the Meta Quest app that puts him in your room (horizon/)
#
# What is at the root is the real phone app: the same conversation screen, the
# same hologram, drawn by CanvasKit instead of native Skia. Taking over the assist
# gesture is Android's alone and the app says so when it is on web, so the page
# is for looking at Jarvis and talking to him, not for replacing your assistant.
#
# Runs only for a release: `release.yml` calls it once Release Please has tagged
# one, handing it the tagged commit, so the page always shows what was released.
# Pushes and pull requests publish nothing. It can still be started by hand from
# the Actions tab, on any branch — which is how a branch's build can be looked at
# on a headset before it is merged. Pages keeps one live site, so the last run
# wins — and the site is one artifact, so every run builds and publishes both
# apps: a run that published one alone would take the other off the site.
on:
  workflow_call:
    inputs:
      ref:
        description: 'The commit to build. Release passes the tagged one, which is not the commit its run started from.'
        type: string
        required: false
        default: ''
  workflow_dispatch:

# Least privilege by default: the job below opts into exactly what it needs.
permissions: {}

# Two deployments cannot be in flight at once — Pages has one live site — but a
# run already under way is left to finish rather than cancelled, so a push while
# one is deploying does not leave the site half-written.
concurrency:
  group: mobile-web-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Checking the code out.
      contents: read
      # Uploading the built site and pointing Pages at it.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # Empty for a manual run, which takes the commit that started it. Release
          # passes the tagged commit — see `deploy` in `release.yml` for why.
          ref: ${{ inputs.ref }}
          # Nothing here needs to push; never leave a usable token in .git/config.
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # `packageManager` in package.json, so this cannot drift from the pin.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `setup-skia-web` copies canvaskit.wasm into mobile/public/, which the export
      # publishes as-is. The file is gitignored — it comes from the Skia package
      # rather than the repository — so without this the site goes up without it,
      # the browser's fetch for it returns the 404 page, instantiating that throws,
      # and the hologram's error boundary holds its space empty. Which is exactly
      # how the first published page looked: everything but Jarvis.
      - name: Fetch CanvasKit
        run: bunx turbo initialize --filter=mobile

      # First, so a headset app that does not build fails the run before the phone
      # app's slower export. `turbo build` also runs its initialize (the wasm into
      # public/vendor/), lint and typecheck, and writes it to dist/horizon. Its
      # asset URLs are relative, so it needs no base path of its own.
      - name: Build the headset app
        run: bunx turbo build --filter=horizon

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      # A project site lives under /<repo>/, so the build is told its own prefix —
      # see `experiments.baseUrl` in app.config.ts. Without it every asset the page
      # asks for is looked for at the domain root and comes back 404.
      - name: Export the web build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: bunx expo export --platform web --output-dir dist --clear
        working-directory: mobile

      # One folder for the one site: the phone app at its root, the headset app in
      # horizon/. Nothing in the phone's export is called horizon, so they never clash.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r mobile/dist/. _site/
          cp -r dist/horizon _site/horizon

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
