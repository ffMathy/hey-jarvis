name: Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Advisories are published continuously, so re-audit the pinned tree daily
    # even when nothing in the repository changed.
    - cron: "17 6 * * *"

# Least privilege by default: every job below opts into exactly what it needs.
permissions: {}

concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with the `packageManager` field in package.json.
          bun-version: "1.3.9"

      # Exact pins, no install scripts, no foreign lockfiles, SHA-pinned
      # actions. Runs before anything is installed, because it is what decides
      # whether installing is safe in the first place.
      - name: Verify supply chain policy
        run: bash ./.scripts/check-supply-chain.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun install --frozen-lockfile` must be a no-op on a clean checkout; a
      # dirty tree afterwards means the lockfile does not match package.json.
      - name: Verify the lockfile is up to date
        run: |
          if [ -n "$(git status --porcelain bun.lock)" ]; then
            echo "❌ bun.lock is out of date — run 'bun install' and commit the result."
            git --no-pager diff -- bun.lock
            exit 1
          fi
          echo "✅ bun.lock matches package.json"

      - name: Audit dependencies for known vulnerabilities
        run: bun audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Blocks pull requests that introduce a dependency with a known
      # high-severity advisory or an unacceptable license.
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
