# This workflow is managed by gh actions-lock.

name: Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Advisories are published continuously, so re-audit the pinned tree daily
    # even when nothing in the repository changed.
    - cron: "17 6 * * *"

# Least privilege by default: every job below opts into exactly what it needs.
permissions: {}

concurrency:
  group: security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Keep in sync with the `packageManager` field in package.json.
          bun-version: "1.3.9"

      # Exact pins, no install scripts, no foreign lockfiles, SHA-pinned
      # actions. Runs before anything is installed, because it is what decides
      # whether installing is safe in the first place.
      - name: Verify supply chain policy
        run: bash ./.scripts/check-supply-chain.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun install --frozen-lockfile` must be a no-op on a clean checkout; a
      # dirty tree afterwards means the lockfile does not match package.json.
      - name: Verify the lockfile is up to date
        run: |
          if [ -n "$(git status --porcelain bun.lock)" ]; then
            echo "❌ bun.lock is out of date — run 'bun install' and commit the result."
            git --no-pager diff -- bun.lock
            exit 1
          fi
          echo "✅ bun.lock matches package.json"

      # The tree carries no critical advisories, so any new one is a regression
      # introduced by the change under review. This gate blocks.
      - name: Fail on critical advisories
        run: bun audit --audit-level=critical

      # What remains is high/moderate and transitive, blocked on upstream
      # packages that still pin vulnerable ranges — see AGENTS.md → Supply
      # Chain Security for why each one cannot be forced. Reported, not gated;
      # the dependency-review job below blocks *new* high-severity additions.
      - name: Report remaining advisories
        continue-on-error: true
        run: bun audit --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Blocks pull requests that introduce a dependency with a known
      # high-severity advisory or an unacceptable license.
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
