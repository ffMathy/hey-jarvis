# This workflow is managed by gh actions-lock.

name: Release

on:
  push:
    branches: [ main ]

# Least privilege by default: every job below opts into exactly what it needs.
permissions: {}

# Never let two releases build and push images concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Resolved at run time from the `Jarvis` 1Password vault by
  # .scripts/run-with-env.sh — see the CI workflow for the same pattern.
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  GITHUB_ACTIONS: true

jobs:
  # Every push to main is a release, cut from that very commit: no release pull request, nothing
  # committed back. The version is the last `root-v*` tag raised by the conventional commits since
  # it (`feat` the minor, a breaking change the major, everything else the patch), and the notes on
  # the GitHub Release are the changelog. See `.scripts/release.js` and "Releases" in AGENTS.md.
  release:
    runs-on: ubuntu-latest
    permissions:
      # To create the tag and the GitHub Release.
      contents: write
    outputs:
      tag_name: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # The whole history and its tags, to find the last release and every commit since.
          fetch-depth: 0
          persist-credentials: false

      # `node` is already on the runner, and the script needs nothing else.
      - name: Work out the release
        id: release
        run: node .scripts/release.js "$GITHUB_SHA"

      # Through the API rather than `git push`, so the checkout keeps no usable token. The tag is
      # created on the pushed commit itself, not on whatever main has moved on to since.
      - name: Tag it and publish the release
        if: ${{ steps.release.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$NOTES"

  # The phone and the watch on Google Play, to the closed test.
  #
  # Only a release publishes to Play; pull requests build the APKs but upload nothing.
  #
  # **Closed testing rather than production, and not only because the app is not ready to be
  # public.** Release 2.2.0 went at `production` and Play took the bundle and then refused to commit
  # the release — `Precondition check failed.`, with no detail whatsoever. A personal developer
  # account cannot publish to production until it has run a closed test with twelve testers for
  # fourteen continuous days and been granted access, so the closed track is both where this can go
  # today *and* how that requirement gets satisfied. See section 9 of `docs/play-store.md`.
  #
  # `completed` rather than `draft`, because a release that lands on `main` is a release: it goes
  # out to the testers rather than waiting in the Console for somebody to press a button. To hold
  # one back, hold the commits back — the same rule as everything else here.
  play:
    if: ${{ needs.release.outputs.version != '' }}
    needs:
      - release
    permissions:
      contents: read
    uses: ./.github/workflows/play.yml
    with:
      # The released commit, and the version it was released as: nothing in the repository carries
      # the version any more, so the bundles are stamped with the one handed in here.
      ref: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
      # `alpha` *is* closed testing. The Console calls the track "Closed testing" and the API calls
      # it `alpha`; they are the same track, and there is no track named `closed`.
      track: alpha
      # **And the watch goes to `wear:internal`, which is not a typo for a closed track.** There
      # isn't one. The API lists every track it has when handed a name it does not know, and that
      # list is `production,beta,alpha,internal,wear:beta,wear:internal,wear:production` — a
      # `wear:alpha` is simply not among them, so the phone's closed track has no Wear OS twin to
      # pair with. Of what does exist, `wear:internal` is the only one that is not public:
      # `wear:beta` is *open* testing. The watch therefore stays where pull requests already put it,
      # which is also the track that reaches a paired watch. If a Wear OS closed track ever appears
      # in that list, this is the one line to change.
      wearTrack: wear:internal
      status: completed
    # Named one by one rather than `inherit`, which would hand the called workflow every secret
    # this repository has. It needs exactly this: the 1Password service account token, which is how
    # it reaches the upload keystore and the Play publisher account.
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # The web build of the app, to GitHub Pages, from the released commit.
  pages:
    if: ${{ needs.release.outputs.version != '' }}
    needs:
      - release
    permissions:
      # Pages serves the `gh-pages` branch, so publishing is a push to it.
      contents: write
      pages: read
    uses: ./.github/workflows/mobile-web.yml
    with:
      ref: ${{ needs.release.outputs.sha }}

  deploy:
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.version != '' }}
    needs:
      - release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Only remove what we definitely don't need for faster cleanup
          android: false
          dotnet: true
          haskell: true
          large-packages: false  # Skip large packages check to save time
          docker-images: false   # Skip Docker image removal for devcontainer
          swap-storage: false    # Skip swap removal to save time

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # The released commit, even if main has moved on while this run
          # waited its turn.
          ref: ${{ needs.release.outputs.sha }}
          # The deploy runs project code and container builds; don't leave a
          # usable GitHub token behind in .git/config.
          persist-credentials: false

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy in dev container
        uses: devcontainers/ci@v0.3.1900000450
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ghcr.io
          IMAGE_OWNER: ${{ env.REPO_OWNER_LC }}
          # What the MCP image is tagged with (`mcp/.scripts/deploy.sh`).
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        with:
          imageName: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          push: always
          runCmd: |
            bun install --frozen-lockfile
            bunx turbo deploy
          env: |
            GITHUB_TOKEN
            GITHUB_ACTOR
            GITHUB_ACTIONS
            REGISTRY
            IMAGE_OWNER
            RELEASE_VERSION

            OP_SERVICE_ACCOUNT_TOKEN
