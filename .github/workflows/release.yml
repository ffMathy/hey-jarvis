# This workflow is managed by gh actions-lock.

name: Release

on:
  push:
    branches: [ main ]

# Least privilege by default: every job below opts into exactly what it needs.
permissions: {}

# Never let two releases build and push images concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Resolved at run time from the `Jarvis` 1Password vault by
  # .scripts/run-with-env.sh — see the CI workflow for the same pattern.
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  GITHUB_ACTIONS: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # A release is cut either by the run that follows a human merging the
      # release pull request, or — now that the pull request merges itself — by
      # the tagging step further down in this same run.
      release_created: ${{ steps.release.outputs.release_created || steps.tag.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.tag.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.tag.outputs.version }}
      sha: ${{ steps.release.outputs.sha || steps.tag.outputs.sha }}
    steps:
      - name: Release using "Release Please"
        id: release
        uses: googleapis/release-please-action@v4.4.1
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main

      # A release pull request only restates commits that already went through
      # review and CI on main, so it never needs a second human read. Hand it to
      # GitHub's auto-merge, which lands it once branch protection is satisfied;
      # auto-merge refuses a pull request that has nothing left to wait for, so
      # fall back to merging it outright.
      - name: Auto-merge the release pull request
        id: merge
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          merged=false
          for number in $(jq -r '.[].number' <<<"$RELEASE_PRS"); do
            echo "Merging release pull request #${number}"
            gh pr merge "${number}" --squash --auto ||
              gh pr merge "${number}" --squash

            if [ "$(gh pr view "${number}" --json merged --jq '.merged')" = 'true' ]; then
              merged=true
            else
              echo "::notice::Pull request #${number} is waiting on auto-merge. Its own merge starts no workflow run, so the release is tagged by the next run of this workflow."
            fi
          done

          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

      # A merge performed with GITHUB_TOKEN does not start another workflow run,
      # so the push that just landed on main never comes back around to tag the
      # release. Run Release Please once more instead: it picks up the release
      # pull request it has just seen merged and cuts the tags and GitHub
      # releases here, in the same run, so `deploy` below has something to ship.
      - name: Tag the merged release
        id: tag
        if: ${{ steps.merge.outputs.merged == 'true' }}
        uses: googleapis/release-please-action@v4.4.1
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main

  # The phone and the watch on Google Play, to the closed test.
  #
  # The same build a pull request publishes to internal testing — `play.yml` is one workflow with
  # two entry points precisely so that the thing a release publishes is the thing that has been
  # going to testers all along, rather than a second pipeline nobody exercises until the day it
  # matters. All that changes is the track.
  #
  # **Closed testing rather than production, and not only because the app is not ready to be
  # public.** Release 2.2.0 went at `production` and Play took the bundle and then refused to commit
  # the release — `Precondition check failed.`, with no detail whatsoever. A personal developer
  # account cannot publish to production until it has run a closed test with twelve testers for
  # fourteen continuous days and been granted access, so the closed track is both where this can go
  # today *and* how that requirement gets satisfied. See section 9 of `docs/play-store.md`.
  #
  # `completed` rather than `draft`, because a release that lands on `main` is a release: it goes
  # out to the testers rather than waiting in the Console for somebody to press a button. To hold
  # one back, hold the commits back — the same rule as everything else here.
  play:
    if: ${{ needs.release.outputs.release_created }}
    needs:
      - release
    permissions:
      contents: read
    uses: ./.github/workflows/play.yml
    with:
      # The tagged commit, for the same reason `deploy` checks it out: the release pull request
      # merged inside this run, so only that commit carries the bumped version the bundles are
      # stamped with.
      ref: ${{ needs.release.outputs.sha }}
      # `alpha` *is* closed testing. The Console calls the track "Closed testing" and the API calls
      # it `alpha`; they are the same track, and there is no track named `closed`.
      track: alpha
      # **And the watch goes to `wear:internal`, which is not a typo for a closed track.** There
      # isn't one. The API lists every track it has when handed a name it does not know, and that
      # list is `production,beta,alpha,internal,wear:beta,wear:internal,wear:production` — a
      # `wear:alpha` is simply not among them, so the phone's closed track has no Wear OS twin to
      # pair with. Of what does exist, `wear:internal` is the only one that is not public:
      # `wear:beta` is *open* testing. The watch therefore stays where pull requests already put it,
      # which is also the track that reaches a paired watch. If a Wear OS closed track ever appears
      # in that list, this is the one line to change.
      wearTrack: wear:internal
      status: completed
    # Named one by one rather than `inherit`, which would hand the called workflow every secret
    # this repository has. It needs exactly this: the 1Password service account token, which is how
    # it reaches the upload keystore and the Play publisher account.
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.release_created }}
    needs:
      - release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Only remove what we definitely don't need for faster cleanup
          android: false
          dotnet: true
          haskell: true
          large-packages: false  # Skip large packages check to save time
          docker-images: false   # Skip Docker image removal for devcontainer
          swap-storage: false    # Skip swap removal to save time

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # Check out the commit that was actually tagged. When the release
          # pull request merged inside this same run, that commit is newer than
          # the one this run started from, and only it carries the bumped
          # versions the deploy publishes.
          ref: ${{ needs.release.outputs.sha }}
          # The deploy runs project code and container builds; don't leave a
          # usable GitHub token behind in .git/config.
          persist-credentials: false

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy in dev container
        uses: devcontainers/ci@v0.3.1900000450
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ghcr.io
          IMAGE_OWNER: ${{ env.REPO_OWNER_LC }}
        with:
          imageName: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          push: always
          runCmd: |
            bun install --frozen-lockfile
            bunx turbo deploy
          env: |
            GITHUB_TOKEN
            GITHUB_ACTOR
            GITHUB_ACTIONS
            REGISTRY
            IMAGE_OWNER

            OP_SERVICE_ACCOUNT_TOKEN
