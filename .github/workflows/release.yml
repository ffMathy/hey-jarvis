# This workflow is managed by gh actions-lock.

name: Release

on:
  push:
    branches: [ main ]

# Least privilege by default: every job below opts into exactly what it needs.
permissions: {}

# Never let two releases build and push images concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Resolved at run time from the `Jarvis` 1Password vault by
  # .scripts/run-with-env.sh — see the CI workflow for the same pattern.
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  GITHUB_ACTIONS: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # A release is cut either by the run that follows a human merging the
      # release pull request, or — now that the pull request merges itself — by
      # the tagging step further down in this same run.
      release_created: ${{ steps.release.outputs.release_created || steps.tag.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.tag.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.tag.outputs.version }}
      sha: ${{ steps.release.outputs.sha || steps.tag.outputs.sha }}
    steps:
      - name: Release using "Release Please"
        id: release
        uses: googleapis/release-please-action@v4.4.1
        with:
          # Falls back to GITHUB_TOKEN, whose pull requests never get checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main

      # A release pull request only restates commits that already went through
      # review and CI on main, so it never needs a second human read.
      - name: Auto-merge the release pull request
        id: merge
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          merged=false
          blocked=false
          for number in $(jq -r '.[].number' <<<"$RELEASE_PRS"); do
            echo "Merging release pull request #${number}"

            # Merge it outright first. Branch protection still applies — a token
            # cannot merge past a rule it does not satisfy — so this lands only
            # what is already allowed to land, and it keeps the tagging step
            # below inside this same run.
            if gh pr merge "${number}" --squash; then
              merged=true
              continue
            fi

            # Something still gates the merge, so leave auto-merge armed: the
            # release then lands by itself the moment that clears.
            gh pr merge "${number}" --squash --auto || true

            # Whether that is worth waiting for depends on who opened the pull
            # request. GitHub starts no workflow run for one opened with
            # GITHUB_TOKEN, so a required check on it never reports and
            # auto-merge waits on it forever — a release going nowhere behind a
            # green run. Any other author gets real checks, and waiting is
            # exactly right.
            if [ "$(gh pr view "${number}" --json author --jq '.author.login')" = 'github-actions' ]; then
              blocked=true
              echo "::error::Release pull request #${number} cannot merge itself. It was opened with GITHUB_TOKEN, so no workflow runs against it and any required check stays pending forever. Give Release Please a token of its own in the RELEASE_PLEASE_TOKEN secret, or exempt release-please--branches--main from the rule that blocks it."
            else
              echo "::notice::Release pull request #${number} is waiting on auto-merge, and lands once its checks pass."
            fi
          done

          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

          # Fail the run rather than let a stuck release look like a finished one.
          [ "${blocked}" = false ]

      # A merge performed with GITHUB_TOKEN does not start another workflow run,
      # so the push that just landed on main never comes back around to tag the
      # release. Run Release Please once more instead: it picks up the release
      # pull request it has just seen merged and cuts the tags and GitHub
      # releases here, in the same run, so `deploy` below has something to ship.
      - name: Tag the merged release
        id: tag
        if: ${{ steps.merge.outputs.merged == 'true' }}
        uses: googleapis/release-please-action@v4.4.1
        with:
          # Falls back to GITHUB_TOKEN, whose pull requests never get checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          target-branch: main

  deploy:
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.release_created }}
    needs:
      - release
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Only remove what we definitely don't need for faster cleanup
          android: false
          dotnet: true
          haskell: true
          large-packages: false  # Skip large packages check to save time
          docker-images: false   # Skip Docker image removal for devcontainer
          swap-storage: false    # Skip swap removal to save time

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # Check out the commit that was actually tagged. When the release
          # pull request merged inside this same run, that commit is newer than
          # the one this run started from, and only it carries the bumped
          # versions the deploy publishes.
          ref: ${{ needs.release.outputs.sha }}
          # The deploy runs project code and container builds; don't leave a
          # usable GitHub token behind in .git/config.
          persist-credentials: false

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy in dev container
        uses: devcontainers/ci@v0.3.1900000450
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          REGISTRY: ghcr.io
          IMAGE_OWNER: ${{ env.REPO_OWNER_LC }}
        with:
          imageName: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          push: always
          runCmd: turbo deploy
          env: |
            GITHUB_TOKEN
            GITHUB_ACTOR
            GITHUB_ACTIONS
            REGISTRY
            IMAGE_OWNER

            OP_SERVICE_ACCOUNT_TOKEN
