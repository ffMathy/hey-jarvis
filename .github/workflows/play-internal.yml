# This workflow is managed by gh actions-lock.

name: Play internal testing

# Builds a signed Android App Bundle and uploads it to the app's internal testing track.
#
# Internal testing rather than a public release: it goes to a named list of up to a hundred testers,
# is available within minutes rather than after a review, and never appears in search. It is also
# the only track that can get the app onto a paired Wear OS watch without a public listing, which is
# what `JARVIS_IS_ON_PLAY` in `mobile/src/watch-card.tsx` is waiting for.
#
# Every push to a pull request publishes, so the build on your phone and your watch is the branch
# you are working on without anybody having to go and press anything. Only pushes that could change
# the app: the same paths the APK workflow watches, because a README edit has no way into a bundle.
#
# Each one costs a `versionCode`, which can never be reused — there are two billion of them and the
# run number is what spends them, so this is not a real constraint, but it is why nothing here
# retries and why the bundle is kept as an artifact even when the upload fails.
#
# What it needs, and where each one comes from, is in `docs/play-store.md`.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      # The sphere itself lives in its own package now, shared with the watch.
      - 'hologram/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/play-internal.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Which Play track to upload to'
        type: choice
        default: internal
        options:
          - internal
          - alpha
        required: true
      status:
        description: 'draft leaves it for you to release by hand; completed sends it to testers'
        type: choice
        default: completed
        options:
          - completed
          - draft
        required: true

# Least privilege by default: the job below opts into exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      # The only secret this workflow knows about. Every HEY_JARVIS_* value it needs — the upload
      # keystore, its passwords, the Play publisher account — is resolved at run time from the
      # `Jarvis` 1Password vault by `.scripts/run-with-env.sh`, exactly as `build.yml` does. Nothing
      # here is mirrored into GitHub Actions secrets, so adding a value is a 1Password change and
      # not a repository one.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # The runner's Android SDK is what this job builds with.
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      # Straight on the runner rather than in the dev container used by CI: the runner image already
      # carries the Android SDK with its licences accepted, which the container does not.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # `packageManager` in package.json, so this cannot drift from the pin.
          bun-version-file: package.json

      # React Native's Gradle plugin bundles the JavaScript by running `node` itself, and 0.86
      # refuses anything older than 20.19.4.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # This job runs straight on the runner rather than in the dev container, which is where the
      # `op` CLI normally comes from — so it has to be installed. `run-with-env.sh` shells out to
      # `op run`, and without this it would fail with "1Password CLI is not authenticated".
      - name: Set up the 1Password CLI
        uses: 1password/install-cli-action@v4.1.0

      - name: Restore Gradle dependency cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'mobile/app.config.ts', 'mobile/modules/*/android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No secrets listed: `build:aab` goes through `run-with-env.sh mobile/op.env`, which resolves
      # the four signing values from 1Password with the token above. The same command a laptop runs.
      - name: Build signed bundle
        env:
          # Play orders uploads by this and refuses a repeat, so it has to rise every time. The run
          # number does, for the life of the workflow, and never goes backwards.
          JARVIS_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bunx turbo build:aab --filter=mobile

      # Kept whatever happens to the upload. A bundle that Play rejected is still the bundle that
      # was built, and the only copy of it: the next run gets a different versionCode and cannot
      # reproduce this one.
      - name: Upload bundle as an artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: jarvis-${{ github.run_number }}.aab
          path: dist/mobile-aab/jarvis.aab
          if-no-files-found: error
          retention-days: 30

      # Straight from 1Password into a file, because the action takes a path and because a value
      # that never enters the environment cannot be printed by anything downstream. Its own env file
      # rather than `mobile/op.env`: nothing runnable on a laptop uploads to Play, so listing it
      # there would make every local bundle build stop to fetch a secret it was not going to use.
      - name: Fetch the Play publisher account
        run: |
          bash ./.scripts/run-with-env.sh mobile/op.publish.env \
            bash -c 'printf "%s" "$HEY_JARVIS_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play-publisher.json'

      - name: Publish to Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: play-publisher.json
          packageName: com.ffmathy.heyjarvis
          releaseFiles: dist/mobile-aab/jarvis.aab
          # The inputs only exist when this was started by hand. A pull request push takes the
          # defaults, which are the ones worth having automatically: straight to the testers.
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}

      # However the upload went, and even if the job was cancelled part way through it.
      - name: Shred the publisher account
        if: always()
        run: rm -f play-publisher.json
