# This workflow is managed by gh actions-lock.

name: Wear APK

# Builds the Wear OS app and uploads the APK as a workflow artifact, unzipped,
# so it can be installed on a watch over wireless debugging — see wear/AGENTS.md.
#
# Only changes that can alter the watch app start it — including `hologram/`,
# which is where the sphere the watch draws actually lives.
on:
  push:
    branches: [ main ]
    paths:
      - 'wear/**'
      # The sphere itself lives in its own package, shared with the phone.
      - 'hologram/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/wear-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'wear/**'
      # The sphere itself lives in its own package, shared with the phone.
      - 'hologram/**'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/wear-apk.yml'
  workflow_dispatch:

# Least privilege by default: the job below opts into exactly what it needs.
permissions: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Checkout is the only thing that needs the token. Uploading an artifact goes
    # through the Actions runtime's own credential, not GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          # The build runs untrusted pull request code; never leave a usable
          # GitHub token behind in .git/config for it to pick up.
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # The runner's Android SDK is what this job builds with.
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # `packageManager` in package.json, so this cannot drift from the pin.
          bun-version-file: package.json

      # React Native's Gradle plugin bundles the JavaScript by running `node`
      # itself, and 0.86 refuses anything older than 20.19.4 — so the version is
      # pinned rather than left to whatever the runner image ships.
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          # There is no npm/yarn/pnpm cache to restore; dependencies come from bun.
          package-manager-cache: false

      - name: Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle dependency cache
        uses: actions/cache@v5.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: gradle-wear-${{ runner.os }}-${{ hashFiles('bun.lock', 'wear/app.config.ts') }}
          restore-keys: |
            gradle-wear-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The runner image's Android SDK, with its licences already accepted.
      - name: Build APK
        run: bunx turbo build:apk --filter=wear

      # The artifact is named after the file. On a pull request GITHUB_SHA is
      # GitHub's temporary merge commit, so the branch head is used there instead.
      - name: Name APK after the commit
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: mv dist/wear-apk/jarvis-wear.apk "dist/wear-apk/jarvis-wear-${COMMIT_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          path: dist/wear-apk/jarvis-wear-*.apk
          # Uploaded as the file itself rather than zipped, so it can go straight
          # to `adb install`.
          archive: false
          if-no-files-found: error
          retention-days: 30
