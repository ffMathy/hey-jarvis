# This workflow is managed by gh actions-lock.

name: CI

# Only the mocked half of the suite runs here. `turbo test:integration` holds real
# conversations, calls real APIs and spends real quota, so it never runs on
# GitHub Actions at all -- it runs when someone runs it by hand.
on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [ main ]

# Least privilege by default: every job below opts into exactly what it needs.
permissions: {}

env:
  GITHUB_ACTIONS: true

jobs:
  build:
    concurrency:
      group: build-${{ github.actor }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increase timeout for ESP-IDF toolchain downloads
    permissions:
      contents: read
      packages: read
      models: read

    env:
      # The firmware build only ever needs placeholders, so real WiFi credentials
      # never have to reach CI.
      HEY_JARVIS_WIFI_SSID: "dummy-wifi-ssid-for-ci"
      HEY_JARVIS_WIFI_PASSWORD: "dummy-wifi-password-for-ci"

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Only remove what we definitely don't need for faster cleanup
          android: false
          dotnet: true
          haskell: true
          large-packages: false  # Skip large packages check to save time
          docker-images: false   # Skip Docker image removal for devcontainer
          swap-storage: false    # Skip swap removal to save time

      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0  # Fetch all history for turbo affected detection to work
          # The build runs untrusted pull request code; never leave a usable
          # GitHub token behind in .git/config for it to pick up.
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch origin main:main

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Restore Turborepo cache
        uses: actions/cache@v5.1.0
        with:
          path: .turbo
          key: turbo-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-cache-${{ runner.os }}-

      # No OP_SERVICE_ACCOUNT_TOKEN reaches this job. `turbo test` runs only the
      # mocked half of the suite, and the absence of the token is what keeps it
      # honest: a test that quietly started reaching for a real credential fails
      # here instead of passing on someone else's account.
      - name: Build and test in dev container
        uses: devcontainers/ci@v0.3.1900000450
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          IMAGE_OWNER: ${{ env.REPO_OWNER_LC }}
          REGISTRY: ghcr.io
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          WORKSPACE_ROOT: /workspaces/hey-jarvis
        with:
          imageName: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          push: never
          runCmd: |
            bun install --frozen-lockfile
            bunx turbo build
            bunx turbo test
            bunx turbo e2e --filter=mobile
          env: |
            GITHUB_ACTIONS
            GITHUB_TOKEN
            GITHUB_ACTOR
            IMAGE_TAG
            IMAGE_OWNER
            REGISTRY
            WORKSPACE_ROOT
            TURBO_TOKEN
            TURBO_TEAM

            HEY_JARVIS_WIFI_SSID
            HEY_JARVIS_WIFI_PASSWORD
