name: CI

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [ main ]

env:
  # Every HEY_JARVIS_* secret is resolved at run time from the `Jarvis`
  # 1Password vault by .scripts/run-with-env.sh, so CI needs only this one token
  # instead of mirroring ~30 values as GitHub Actions secrets.
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  # The firmware build only ever needs placeholders, so real WiFi credentials
  # never have to reach CI.
  HEY_JARVIS_WIFI_SSID: "dummy-wifi-ssid-for-ci"
  HEY_JARVIS_WIFI_PASSWORD: "dummy-wifi-password-for-ci"

  GITHUB_ACTIONS: true

jobs:
  build:
    concurrency:
      group: build-${{ github.actor }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: ${{ github.actor != 'dependabot[bot]' }}
      
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Increase timeout for ESP-IDF toolchain downloads
    permissions:
      contents: read
      packages: read
      models: read

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          # Only remove what we definitely don't need for faster cleanup
          android: false
          dotnet: true
          haskell: true
          large-packages: false  # Skip large packages check to save time
          docker-images: false   # Skip Docker image removal for devcontainer
          swap-storage: false    # Skip swap removal to save time

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for turbo affected detection to work

      - name: Fetch base branch
        run: git fetch origin main:main

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Restore Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-cache-${{ runner.os }}-

      - name: Build and test in dev container
        uses: devcontainers/ci@v0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          IMAGE_OWNER: ${{ env.REPO_OWNER_LC }}
          REGISTRY: ghcr.io
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          WORKSPACE_ROOT: /workspaces/hey-jarvis
        with:
          imageName: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          cacheFrom: ghcr.io/${{ env.REPO_OWNER_LC }}/devcontainer
          push: never
          runCmd: |
            turbo build
            turbo test
          env: |
            GITHUB_ACTIONS
            GITHUB_TOKEN
            GITHUB_ACTOR
            IMAGE_TAG
            IMAGE_OWNER
            REGISTRY
            WORKSPACE_ROOT
            TURBO_TOKEN
            TURBO_TEAM

            OP_SERVICE_ACCOUNT_TOKEN

            HEY_JARVIS_WIFI_SSID
            HEY_JARVIS_WIFI_PASSWORD

  auto-merge:
    needs: build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
