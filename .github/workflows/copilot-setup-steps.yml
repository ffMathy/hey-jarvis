name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# Least privilege by default: the job below opts into exactly what it needs.
permissions: {}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    env:
      WORKSPACE_ROOT: /home/runner/work/hey-jarvis/hey-jarvis

      # Pinned cloudflared release plus the SHA-256 of its .deb, so a
      # compromised or swapped release asset can never be installed silently.
      CLOUDFLARED_VERSION: "2026.8.1"
      CLOUDFLARED_SHA256: "e430a257d74d60a80b870ac86d4c6be0bf6d4766f2a72461a6056afce9d8a140"

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep in sync with the `packageManager` field in package.json.
          bun-version: "1.3.9"

      - name: Install dependencies
        # --frozen-lockfile fails instead of silently resolving anything that is
        # not already pinned in bun.lock.
        run: bun install --frozen-lockfile

      - name: Put the workspace's pinned Turborepo on PATH
        # Uses the exact turbo version from bun.lock rather than installing an
        # unpinned global copy.
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> $GITHUB_PATH

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL --output cloudflared.deb \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          echo "${CLOUDFLARED_SHA256}  cloudflared.deb" | sha256sum --check --strict
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb
          cloudflared --version
