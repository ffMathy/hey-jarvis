plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.jarvisgreeting'
version = '0.1.0'

android {
  namespace 'expo.modules.jarvisgreeting'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // LiveKit's hold on WebRTC's audio processing, which `HeldVoice` plays what was said while
  // connecting through. Both apps that link this module depend on @livekit/react-native.
  implementation project(':livekit_react-native')
}
